name: ai-gateway-dev-portal
metadata:
  template: azd-init
infra:
  provider: bicep
  layers:
    - name: auth-vault
      path: ./infra/azd-vault
    - name: app
      path: ./infra/azd
      dependsOn:
        - auth-vault
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      image: ai-gateway-dev-portal
      remoteBuild: true
      buildArgs:
        - VITE_AZURE_CLIENT_ID=${VITE_AZURE_CLIENT_ID}
